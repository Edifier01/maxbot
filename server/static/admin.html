<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MAX Sender — Админ</title>
  <link rel="stylesheet" href="/static/fonts/fonts.css">
  <style>
    :root {
      --bg: #0f1117; --bg-soft: #1a1d27; --text: #e8eaef; --muted: #8b92a5;
      --accent: #5b8def; --danger: #ef5b5b; --ok: #3dd68c; --line: #2a2f3d;
    }
    * { box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; }
    header { padding: 1rem 1.25rem; border-bottom: 1px solid var(--line); display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
    main { padding: 1rem 1.25rem; max-width: 1100px; margin: 0 auto; }
    h1 { margin: 0; font-size: 1.2rem; }
    .hint { color: var(--muted); font-size: .85rem; }
    a, button.link { color: var(--accent); background: none; border: none; cursor: pointer; font: inherit; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; margin-top: 1rem; }
    th, td { text-align: left; padding: .55rem .5rem; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; }
    .panel { background: var(--bg-soft); border: 1px solid var(--line); border-radius: 10px; padding: 1rem; margin-bottom: 1rem; }
    input, button.btn {
      padding: .45rem .65rem; border-radius: 6px; border: 1px solid var(--line);
      background: var(--bg); color: var(--text); cursor: pointer;
    }
    button.btn:hover:not(:disabled) { border-color: var(--accent); }
    button.btn:disabled { opacity: .55; cursor: wait; }
    button.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.btn.danger { background: rgba(127,29,29,.55); border-color: #991b1b; color: #fca5a5; }
    .days-group {
      display: inline-flex; align-items: stretch; border: 1px solid var(--line);
      border-radius: 6px; overflow: hidden; background: var(--bg);
    }
    .days-group input {
      width: 3rem; border: none; border-left: 1px solid var(--line); border-right: 1px solid var(--line);
      border-radius: 0; text-align: center; padding: .45rem .35rem; cursor: text;
    }
    .days-group .days-label {
      display: flex; align-items: center; padding: 0 .55rem; color: var(--muted); font-size: .85rem;
    }
    .days-group button.btn { border: none; border-radius: 0; }
    .badge { font-size: .75rem; padding: .15rem .45rem; border-radius: 4px; background: #2a3348; }
    .badge.ok { background: #1a3d2e; color: var(--ok); }
    .badge.no { background: #3d1a1a; color: var(--danger); }
    .badge.warn { background: #3d351a; color: #e6b84d; }
    .row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
    .global-groups-panel .row { gap: .65rem; }
    .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -0.25rem; padding: 0 .25rem; }
    .users-table { min-width: 640px; }
    @media (max-width: 720px) {
      header { padding: .85rem 1rem; }
      main { padding: .85rem 1rem 2rem; }
      h1 { font-size: 1.05rem; }
      header .row { width: 100%; margin-left: 0 !important; justify-content: flex-start; }
      .panel { padding: .85rem; }
      .global-groups-panel .btn { flex: 1 1 100%; min-height: 44px; }
      .days-group { flex-wrap: wrap; }
      td .row { flex-direction: column; align-items: stretch; }
      td .row .btn, td .days-group { width: 100%; }
      td .row .btn.primary { order: -1; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Админ-панель</h1>
    <span class="hint" id="adminEmail"></span>
    <span style="margin-left:auto" class="row">
      <button class="link" onclick="logout()">Выход</button>
    </span>
  </header>
  <main>
    <div class="panel global-groups-panel">
      <strong>Группы всех учреждений</strong>
      <p class="hint" style="margin:.35rem 0 .75rem">Включить или выключить участие всех групп в рассылке (поле <code>is_active</code>).</p>
      <div class="row">
        <button class="btn primary" id="btnGroupsOn" onclick="bulkGroups(1)">Включить все группы</button>
        <button class="btn danger" id="btnGroupsOff" onclick="bulkGroups(0)">Выключить все группы</button>
      </div>
      <p class="hint" id="bulkGroupsHint" style="margin:.65rem 0 0">—</p>
    </div>
    <div class="panel">
      <div class="row" style="justify-content:space-between">
        <strong>Подписки, истекающие в ближайшие 7 дней</strong>
        <button class="btn" onclick="loadExpiring()">Обновить</button>
      </div>
      <p class="hint" id="expiringHint">—</p>
      <table id="expiringTable" style="display:none">
        <thead>
          <tr><th>Учреждение</th><th>Email</th><th>До</th><th>Осталось</th></tr>
        </thead>
        <tbody id="expiringBody"></tbody>
      </table>
    </div>
    <div class="panel">
      <div class="row" style="justify-content:space-between">
        <strong>Пользователи (учреждения)</strong>
        <span class="row">
          <a href="/#settings" onclick="openGlobalSettings('#settings'); return false;">Настройки рассылки</a>
          <a href="/#messages" onclick="openGlobalSettings('#messages'); return false;">Сообщения (пул)</a>
        </span>
      </div>
      <div class="table-scroll">
      <table class="users-table">
        <thead>
          <tr>
            <th>Учреждение</th>
            <th>Email</th>
            <th>Подписка</th>
            <th>Статистика</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody id="usersBody"></tbody>
      </table>
      </div>
    </div>
  </main>
  <script>
    function token() { return sessionStorage.getItem('maxAuthToken') || ''; }
    function authHeaders() {
      const h = { 'Content-Type': 'application/json' };
      const t = token();
      if (t) h['Authorization'] = 'Bearer ' + t;
      return h;
    }
    async function api(path, opts = {}) {
      opts.headers = { ...authHeaders(), ...(opts.headers || {}) };
      const r = await fetch('/api' + path, opts);
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.detail || r.statusText);
      return j;
    }
    async function logout() {
      const token = sessionStorage.getItem('maxAdminAuthToken') || sessionStorage.getItem('maxAuthToken');
      if (token) {
        try {
          await fetch('/api/auth/logout', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + token },
          });
        } catch (_) {}
      }
      sessionStorage.removeItem('maxAuthToken');
      sessionStorage.removeItem('maxAdminAuthToken');
      sessionStorage.removeItem('maxImpersonating');
      location.href = '/auth.html';
    }
    async function loadExpiring() {
      const hint = document.getElementById('expiringHint');
      const table = document.getElementById('expiringTable');
      const tbody = document.getElementById('expiringBody');
      try {
        const data = await api('/admin/subscriptions/expiring?days=7');
        const items = data.items || [];
        if (!items.length) {
          hint.textContent = 'Нет подписок, истекающих в ближайшие 7 дней.';
          table.style.display = 'none';
          return;
        }
        hint.textContent = `Найдено: ${items.length}`;
        table.style.display = '';
        tbody.innerHTML = items.map(row => {
          const exp = row.expires_at ? row.expires_at.slice(0, 10) : '?';
          const cls = row.days_left <= 1 ? 'no' : (row.days_left <= 7 ? 'warn' : 'ok');
          return `<tr>
            <td>${esc(row.institution_name)}</td>
            <td>${esc(row.email)}</td>
            <td>${exp}</td>
            <td><span class="badge ${cls}">${row.days_left} дн.</span></td>
          </tr>`;
        }).join('');
      } catch (e) {
        hint.textContent = 'Ошибка: ' + e.message;
        table.style.display = 'none';
      }
    }
    async function loadUsers() {
      const items = (await api('/admin/users')).items;
      const tbody = document.getElementById('usersBody');
      tbody.innerHTML = items.map(u => {
        const sub = u.subscription;
        const subBadge = sub.active
          ? (() => {
              const exp = sub.expires_at ? sub.expires_at.slice(0, 10) : '?';
              const days = sub.expires_at
                ? Math.ceil((new Date(sub.expires_at) - Date.now()) / 86400000)
                : null;
              const cls = days !== null && days <= 7 ? 'warn' : 'ok';
              const hint = days !== null && days <= 7 ? ` (${days} дн.)` : '';
              return `<span class="badge ${cls}">до ${exp}${hint}</span>`;
            })()
          : '<span class="badge no">нет</span>';
        return `<tr>
          <td>${esc(u.institution_name)}</td>
          <td>${esc(u.email)}</td>
          <td>${subBadge}</td>
          <td id="stats-${u.tenant_id}"><button class="btn" onclick="loadStats(${u.tenant_id})">Загрузить</button></td>
          <td class="row">
            <button class="btn primary" onclick="impersonate(${u.tenant_id})">Войти в кабинет</button>
            <button class="btn" onclick="grantMonth(${u.tenant_id}, this)">+30 дней</button>
            <span class="days-group">
              <button class="btn" onclick="grantDays(${u.tenant_id}, this)">+</button>
              <input type="number" id="days-${u.tenant_id}" min="1" max="365" value="7">
              <span class="days-label">дней</span>
            </span>
            <button class="btn danger" onclick="deleteUser(${u.tenant_id}, ${JSON.stringify(u.institution_name)})">Удалить</button>
          </td>
        </tr>`;
      }).join('');
    }
    function esc(s) {
      return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    async function loadStats(tid) {
      const s = await api('/admin/tenants/' + tid + '/stats');
      document.getElementById('stats-' + tid).innerHTML =
        `групп: ${s.groups}, акк: ${s.profiles}, ✓${s.sent} ✗${s.failed}`;
    }
    function rememberAdminToken() {
      if (sessionStorage.getItem('maxImpersonating')) return;
      const t = token();
      if (t) sessionStorage.setItem('maxAdminAuthToken', t);
    }
    function openGlobalSettings(hash) {
      const adminTok = sessionStorage.getItem('maxAdminAuthToken') || token();
      if (adminTok) sessionStorage.setItem('maxAuthToken', adminTok);
      sessionStorage.removeItem('maxImpersonating');
      location.href = '/' + hash;
    }
    async function grantMonth(tid, btn) {
      if (btn) btn.disabled = true;
      try {
        await api('/admin/users/' + tid + '/subscription/month', { method: 'POST' });
        await loadUsers();
      } finally {
        if (btn) btn.disabled = false;
      }
    }
    async function grantDays(tid, btn) {
      const days = parseInt(document.getElementById('days-' + tid).value, 10) || 7;
      if (btn) btn.disabled = true;
      try {
        await api('/admin/users/' + tid + '/subscription', {
          method: 'POST', body: JSON.stringify({ days }),
        });
        await loadUsers();
      } finally {
        if (btn) btn.disabled = false;
      }
    }
    async function impersonate(tid) {
      rememberAdminToken();
      const j = await api('/admin/impersonate/' + tid, { method: 'POST' });
      sessionStorage.setItem('maxAuthToken', j.token);
      sessionStorage.setItem('maxImpersonating', j.institution_name || '');
      location.href = '/';
    }
    async function deleteUser(tid, name) {
      const label = name || ('#' + tid);
      if (!confirm('Удалить учреждение «' + label + '»?\n\nДанные, аккаунты и подписка будут удалены без восстановления.')) return;
      try {
        await api('/admin/users/' + tid, { method: 'DELETE' });
        await loadUsers();
      } catch (e) {
        alert(e.message || 'Не удалось удалить');
      }
    }
    async function bulkGroups(active) {
      const on = active === 1;
      const msg = on
        ? 'Включить все группы у всех учреждений?\n\nОни снова будут участвовать в рассылке.'
        : 'Выключить все группы у всех учреждений?\n\nРассылка по ним не пойдёт, пока группы не включат снова.';
      if (!confirm(msg)) return;
      const hint = document.getElementById('bulkGroupsHint');
      const btnOn = document.getElementById('btnGroupsOn');
      const btnOff = document.getElementById('btnGroupsOff');
      btnOn.disabled = true;
      btnOff.disabled = true;
      hint.textContent = 'Выполняется…';
      try {
        const path = on ? '/admin/groups/activate-all' : '/admin/groups/deactivate-all';
        const r = await api(path, { method: 'POST' });
        hint.textContent = (on ? 'Включено' : 'Выключено') + ': '
          + r.groups_updated + ' групп у ' + r.tenants_processed + ' учреждений'
          + (r.skipped && r.skipped.length ? ' · пропущено ' + r.skipped.length : '');
      } catch (e) {
        hint.textContent = 'Ошибка: ' + e.message;
      } finally {
        btnOn.disabled = false;
        btnOff.disabled = false;
      }
    }
    (async () => {
      try {
        const me = await api('/auth/me');
        if (me.role !== 'admin') {
          document.querySelector('main').innerHTML =
            '<div class="panel">Этот аккаунт не администратор. <a href="/">Перейти в кабинет</a></div>';
          return;
        }
        document.getElementById('adminEmail').textContent = me.email;
        if (!me.impersonating) rememberAdminToken();
        await loadExpiring();
        await loadUsers();
      } catch (e) {
        document.querySelector('main').innerHTML =
          '<div class="panel" style="color:var(--danger)">' +
          '<strong>Не удалось открыть админку</strong><br>' + esc(e.message) +
          '<p class="hint">Частая причина — старая версия сервера. На VDS: git pull && docker compose up --build -d</p>' +
          '<button class="btn" onclick="logout()">Выйти и войти снова</button></div>';
      }
    })();
  </script>
</body>
</html>
