<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c0e14">
  <title>MAX Sender — Вход</title>
  <link rel="stylesheet" href="/static/fonts/fonts.css">
  <style>
    :root {
      --bg: #0c0e14;
      --bg-elev: #141824;
      --bg-soft: #1a1f2e;
      --line: #2a3142;
      --line-soft: #222838;
      --text: #e8eaef;
      --muted: #8b93a7;
      --faint: #7d869c;
      --accent: #3d8bfd;
      --accent-dim: #2563eb;
      --accent-soft: rgba(61,139,253,.16);
      --ok: #3ecf8e;
      --warn: #e6b84d;
      --danger: #ef5f5f;
      --radius: 12px;
      --radius-sm: 8px;
      --shadow: 0 12px 40px rgba(0,0,0,.35);
      --font: "Manrope", system-ui, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, monospace;
      --touch-min: 44px;
      --panel-bg: rgba(20,24,36,.88);
      --topbar-bg: rgba(12,14,20,.82);
      --focus-glow: 0 0 0 3px rgba(61,139,253,.15);
    }
    * { box-sizing: border-box; }
    html { color-scheme: dark; }
    button, a, .link, .btn, input, select { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    h1, h2, h3, .panel-title { text-wrap: pretty; }
    #main-content { scroll-margin-top: 5.5rem; }
    button:focus-visible,
    input:focus-visible,
    .btn:focus-visible,
    .link:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
    body {
      font-family: var(--font);
      color: var(--text); margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(61,139,253,.14), transparent 55%),
        radial-gradient(900px 500px at 100% 0%, rgba(62,207,142,.06), transparent 45%),
        var(--bg);
      background-attachment: fixed;
      padding: max(1rem, env(safe-area-inset-top, 0px))
               max(1rem, env(safe-area-inset-right, 0px))
               max(1rem, env(safe-area-inset-bottom, 0px))
               max(1rem, env(safe-area-inset-left, 0px));
    }
    .card {
      width: 100%; max-width: 420px;
      background: var(--panel-bg);
      border: 1px solid var(--line-soft); border-radius: var(--radius); padding: 1.5rem;
      box-shadow: var(--shadow);
    }
    .brand {
      display: flex; align-items: center; gap: .65rem;
    }
    .brand-mark {
      width: 28px; height: 28px; border-radius: 8px;
      background: linear-gradient(135deg, #3d8bfd, #1d4ed8);
      box-shadow: 0 0 0 1px rgba(61,139,253,.35), 0 6px 16px rgba(37,99,235,.25);
      display: grid; place-items: center;
      font-weight: 700; font-size: .75rem; letter-spacing: .02em;
    }
    h1 { margin: 0; font-size: 1.05rem; font-weight: 700; letter-spacing: -.02em; }
    .hint { color: var(--muted); font-size: .85rem; margin: .35rem 0 1rem; }
    label { display: block; font-size: .85rem; margin: .75rem 0 .25rem; color: var(--muted); }
    input {
      width: 100%; padding: .6rem .75rem; border-radius: var(--radius-sm);
      border: 1px solid var(--line); background: var(--bg); color: var(--text);
      font-family: inherit;
      transition: border-color .15s, box-shadow .15s;
    }
    select, select option {
      background-color: var(--bg);
      color: var(--text);
    }
    input:focus {
      border-color: rgba(61,139,253,.65);
      box-shadow: var(--focus-glow);
    }
    input:focus:not(:focus-visible) { outline: none; }
    button {
      margin-top: 1rem; width: 100%; padding: .55rem 1.05rem;
      border: 1px solid rgba(147,197,253,.25); border-radius: var(--radius-sm);
      background: linear-gradient(180deg, #4b95fd, var(--accent-dim));
      color: #fff; font-weight: 600; cursor: pointer; font-family: inherit;
      box-shadow: 0 6px 16px rgba(37,99,235,.25);
      transition: filter .12s;
    }
    button:hover:not(:disabled):not(.secondary) { filter: brightness(1.06); }
    button:disabled { opacity: .55; cursor: wait; }
    button.secondary {
      background: transparent; border: 1px solid var(--line); color: var(--text);
      margin-top: .5rem; box-shadow: none;
    }
    button.secondary:hover:not(:disabled) { background: var(--bg-soft); }
    .tabs { display: flex; gap: .35rem; margin-bottom: 1rem; }
    .tabs button {
      margin: 0; flex: 1; box-shadow: none;
      background: transparent; border: 1px solid transparent; color: var(--muted);
      padding: .45rem .9rem; border-radius: 999px; font-weight: 500;
    }
    .tabs button.active {
      background: var(--accent-soft); border-color: rgba(61,139,253,.35); color: #dbeafe;
    }
    .tabs button.secondary { margin-top: 0; }
    .skip-link {
      position: absolute; left: -9999px; top: auto; width: 1px; height: 1px; overflow: hidden; z-index: 200;
    }
    .skip-link:focus {
      position: fixed; left: 1rem; top: 1rem; width: auto; height: auto;
      padding: .5rem 1rem; background: var(--accent-dim); color: #fff;
      border-radius: var(--radius-sm); text-decoration: none; font-weight: 600;
    }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }
    .err { color: var(--danger); font-size: .85rem; min-height: 1.2rem; margin-top: .5rem; }
    .panel { display: none; }
    .panel.active { display: block; }
    .remember-row {
      display: flex; align-items: center; gap: .5rem; margin-top: .75rem;
      min-height: var(--touch-min); padding: .25rem 0;
      cursor: pointer; color: var(--muted); font-size: .85rem;
    }
    .remember-row input[type="checkbox"] {
      width: auto; margin: 0; min-height: unset; accent-color: var(--accent);
    }
    @media (max-width: 720px) {
      body {
        align-items: flex-start;
        padding: max(.75rem, env(safe-area-inset-top, 0px))
                 max(.75rem, env(safe-area-inset-right, 0px))
                 max(.75rem, env(safe-area-inset-bottom, 0px))
                 max(.75rem, env(safe-area-inset-left, 0px));
        padding-top: max(1.25rem, env(safe-area-inset-top, 0px));
      }
      .card { padding: 1.15rem; border-radius: 10px; }
      h1 { font-size: 1.2rem; }
      input, button { font-size: 16px; min-height: var(--touch-min); }
      .tabs button { min-height: var(--touch-min); }
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Перейти к содержимому</a>
  <main id="main-content" class="card">
    <div class="brand">
      <div class="brand-mark" translate="no">MS</div>
      <h1 translate="no">MAX Sender</h1>
    </div>
    <p class="hint">Личный кабинет</p>
    <div class="tabs" role="tablist" aria-label="Режим входа">
      <button type="button" id="tabLogin" role="tab" aria-selected="true" aria-controls="panelLogin" tabindex="0" class="active">Вход</button>
      <button type="button" id="tabRegister" role="tab" aria-selected="false" aria-controls="panelRegister" tabindex="-1" class="secondary">Регистрация</button>
    </div>

    <div id="panelLogin" class="panel active" role="tabpanel" aria-labelledby="tabLogin">
      <form id="formLogin">
      <label for="loginEmail">Email</label>
      <input id="loginEmail" name="email" type="email" autocomplete="username" spellcheck="false">
      <label for="loginPass">Пароль</label>
      <input id="loginPass" name="password" type="password" autocomplete="current-password">
      <label class="remember-row">
        <input type="checkbox" id="rememberMeLogin" checked>
        Запомнить меня
      </label>
      <button type="submit" id="btnLogin">Войти</button>
      <p class="err" id="loginErr" aria-live="polite"></p>
      </form>
    </div>

    <div id="panelRegister" class="panel" role="tabpanel" aria-labelledby="tabRegister" hidden>
      <form id="formRegister">
      <label for="regInstitution">Название учреждения</label>
      <input id="regInstitution" name="institution_name" type="text" placeholder="Школа №1…" autocomplete="organization">
      <label for="regEmail">Email</label>
      <input id="regEmail" name="email" type="email" autocomplete="username" spellcheck="false">
      <label for="regPass">Пароль</label>
      <input id="regPass" name="password" type="password" autocomplete="new-password">
      <label for="regPass2">Повтор пароля</label>
      <input id="regPass2" name="password_confirm" type="password" autocomplete="new-password">
      <label class="remember-row">
        <input type="checkbox" id="rememberMeRegister" checked>
        Запомнить меня
      </label>
      <button type="submit" id="btnRegister">Зарегистрироваться</button>
      <p class="err" id="regErr" aria-live="polite"></p>
      </form>
    </div>
  </main>
  <script src="/static/js/auth.js" defer></script>
</body>
</html>
