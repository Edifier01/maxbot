name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-server.txt
          pip install pytest httpx
      - name: Server tests (pre-deploy gate)
        env:
          MAX_TEST: "1"
          MAX_SERVER_MODE: "1"
          JWT_SECRET: ci-deploy-jwt-secret-min-32-characters
        run: python -m pytest tests/ -q

  deploy:
    runs-on: ubuntu-latest
    needs: verify
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            if [[ ! -d .git && -d ../.git ]]; then
              cd ..
            fi
            git fetch origin
            git checkout main 2>/dev/null || git checkout master
            git reset --hard origin/main 2>/dev/null || git reset --hard origin/master
            cd "$(git rev-parse --show-toplevel)"
            if [[ ! -f .env && -f server/.env ]]; then
              cp server/.env .env
            fi
            if [[ ! -f .env ]]; then
              echo "Missing .env at repo root (copy from server/.env or .env.example)"
              exit 1
            fi
            if docker compose ps postgres --status running -q 2>/dev/null | grep -q .; then
              echo "PostgreSQL already running — backing up volumes before rebuild…"
              bash scripts/backup-volumes.sh
            else
              echo "First deploy (postgres not running) — skipping volume backup"
            fi
            docker compose pull redis caddy postgres 2>/dev/null || true
            docker compose build app
            docker compose up -d
            CHECK_HTTPS=0 bash scripts/verify_deploy.sh
