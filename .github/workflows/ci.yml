name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  desktop-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          cd desktop
          pip install -r requirements.txt
          pip install pytest httpx
      - name: Smoke tests
        env:
          MAX_TEST: "1"
          MAX_SERVER_MODE: "0"
        run: cd desktop && pytest tests/ -q

  server-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          cd server
          pip install -r requirements.txt -r requirements-server.txt
          pip install pytest httpx
      - name: Server tests
        env:
          MAX_TEST: "1"
          MAX_SERVER_MODE: "1"
        run: cd server && python -m pytest tests/ -q

  core-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Core sync check
        run: python scripts/check_core_sync.py --strict

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker compose
        working-directory: server
        env:
          DOMAIN: ci.example.com
          LETSENCRYPT_EMAIL: ci@example.com
          JWT_SECRET: ci-jwt-secret-at-least-32-characters-long
          ADMIN_EMAIL: admin@ci.example.com
          ADMIN_PASSWORD: ci-admin-password
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: ci-redis-password
          INTERNAL_SERVICE_TOKEN: ci-internal-service-token
        run: docker compose config -q

  server-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: maxsender
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: maxsender
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maxsender -d maxsender"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          cd server
          pip install -r requirements.txt -r requirements-server.txt
          pip install pytest httpx
      - name: E2E auth/admin/tenant
        env:
          DATABASE_URL: postgresql://maxsender:testpass@localhost:5432/maxsender
          MAX_SERVER_MODE: "1"
          MAX_TEST: "1"
          JWT_SECRET: ci-e2e-jwt-secret-min-32-characters-long
          ADMIN_EMAIL: admin@ci.test
          ADMIN_PASSWORD: CiAdminPass123!
          INTERNAL_SERVICE_TOKEN: ci-internal-token
        run: cd server && python -m pytest tests/test_e2e_server.py -q
