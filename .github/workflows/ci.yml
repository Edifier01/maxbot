name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # SQLite suite without DATABASE_URL. Postgres e2e skipif runs after so those
  # modules cannot silently skip; other PG skipif files stay on server-e2e follow-up.
  server-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: maxsender
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: maxsender
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maxsender -d maxsender"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-server.txt
          pip install pytest httpx
      # DATABASE_URL on the full suite leaks into SQLite tests (db_pg / JWT import order).
      # Keep skipif modules honest with a separate Postgres invocation.
      - name: Server tests
        env:
          MAX_TEST: "1"
          MAX_SERVER_MODE: "1"
          JWT_SECRET: ci-jwt-secret-at-least-32-characters-long
        run: python -m pytest tests/ -q
      # Extra skipif modules (remember-me / cross-tenant / rollback / impersonation)
      # still need per-process isolation; they fail when enabled on this job.
      # server-e2e remains the Postgres gate; this step proves skipif would run.
      - name: Postgres e2e skipif
        env:
          DATABASE_URL: postgresql://maxsender:testpass@localhost:5432/maxsender
          MAX_TEST: "1"
          MAX_SERVER_MODE: "1"
          JWT_SECRET: ci-jwt-secret-at-least-32-characters-long
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: CiAdminPass123!
          INTERNAL_SERVICE_TOKEN: ci-internal-token
        run: python -m pytest -q --tb=short tests/test_e2e_server.py

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker compose
        env:
          DOMAIN: ci.example.com
          LETSENCRYPT_EMAIL: ci@example.com
          JWT_SECRET: ci-jwt-secret-at-least-32-characters-long
          ADMIN_EMAIL: admin@ci.example.com
          ADMIN_PASSWORD: ci-admin-password
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: ci-redis-password
          INTERNAL_SERVICE_TOKEN: ci-internal-service-token
        run: docker compose config -q

  server-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: maxsender
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: maxsender
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maxsender -d maxsender"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-server.txt
          pip install pytest httpx
      - name: E2E auth/admin/tenant
        env:
          DATABASE_URL: postgresql://maxsender:testpass@localhost:5432/maxsender
          MAX_SERVER_MODE: "1"
          MAX_TEST: "1"
          JWT_SECRET: ci-e2e-jwt-secret-min-32-characters-long
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: CiAdminPass123!
          INTERNAL_SERVICE_TOKEN: ci-internal-token
        run: python -m pytest tests/test_e2e_server.py -q
