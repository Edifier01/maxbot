name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:

jobs:
  # SQLite suite without DATABASE_URL. Separate Postgres processes then run
  # skipif modules (remaining PG files + e2e) so they cannot silently skip.
  server-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: maxsender
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: maxsender
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maxsender -d maxsender"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.lock -r requirements-server.lock -r requirements-dev.txt
      # DATABASE_URL on the full suite leaks into SQLite tests (db_pg / JWT import order).
      # Keep skipif modules honest with a separate Postgres invocation.
      - name: Server tests
        env:
          MAX_TEST: "1"
          MAX_SERVER_MODE: "1"
          JWT_SECRET: ci-jwt-secret-at-least-32-characters-long
        run: python -m pytest tests/ -q
      # Remaining PG skipif modules in their own process (not the full suite).
      # DATABASE_URL here must not leak into the SQLite job above.
      - name: Postgres skipif modules
        env:
          DATABASE_URL: postgresql://maxsender:testpass@localhost:5432/maxsender
          MAX_TEST: "1"
          MAX_SERVER_MODE: "1"
          JWT_SECRET: ci-jwt-secret-at-least-32-characters-long
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: CiAdminPass123!
          INTERNAL_SERVICE_TOKEN: ci-internal-token
          REGISTRATION_OPEN: "1"
        run: python -m pytest -q --tb=short tests/test_auth_remember_me.py tests/test_cross_tenant_api.py tests/test_register_rollback.py tests/test_admin_impersonation_campaign.py tests/test_db_pg_helpers.py
      - name: Postgres e2e skipif
        env:
          DATABASE_URL: postgresql://maxsender:testpass@localhost:5432/maxsender
          MAX_TEST: "1"
          MAX_SERVER_MODE: "1"
          JWT_SECRET: ci-jwt-secret-at-least-32-characters-long
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: CiAdminPass123!
          INTERNAL_SERVICE_TOKEN: ci-internal-token
          REGISTRATION_OPEN: "1"
        run: python -m pytest -q --tb=short tests/test_e2e_server.py

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate docker compose
        env:
          DOMAIN: ci.example.com
          LETSENCRYPT_EMAIL: ci@example.com
          JWT_SECRET: ci-jwt-secret-at-least-32-characters-long
          ADMIN_EMAIL: admin@ci.example.com
          ADMIN_PASSWORD: ci-admin-password
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: ci-redis-password
          INTERNAL_SERVICE_TOKEN: ci-internal-service-token
        run: docker compose config -q

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Audit locked production dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          pip-audit -r requirements.lock
          pip-audit -r requirements-server.lock

  backup-restore-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Backup and restore both data stores
        env:
          DOMAIN: ci.example.com
          LETSENCRYPT_EMAIL: ci@example.com
          JWT_SECRET: ci-jwt-secret-at-least-32-characters-long
          ADMIN_EMAIL: admin@ci.example.com
          ADMIN_PASSWORD: ci-admin-password
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: ci-redis-password
          INTERNAL_SERVICE_TOKEN: ci-internal-service-token
        run: bash scripts/dr-smoke.sh

  server-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: maxsender
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: maxsender
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maxsender -d maxsender"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.lock -r requirements-server.lock -r requirements-dev.txt
      - name: E2E auth/admin/tenant
        env:
          DATABASE_URL: postgresql://maxsender:testpass@localhost:5432/maxsender
          MAX_SERVER_MODE: "1"
          MAX_TEST: "1"
          JWT_SECRET: ci-e2e-jwt-secret-min-32-characters-long
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: CiAdminPass123!
          INTERNAL_SERVICE_TOKEN: ci-internal-token
          REGISTRATION_OPEN: "1"
        run: python -m pytest tests/test_e2e_server.py -q

  browser-e2e:
    runs-on: ubuntu-latest
    env:
      BASE_URL: http://127.0.0.1:8765
      MAX_HOST: 127.0.0.1
      MAX_PORT: "8765"
      MAX_TEST: "1"
      MAX_SERVER_MODE: "0"
      JWT_SECRET: browser-ci-jwt-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - name: Install Python dependencies
        run: pip install -r requirements.lock -r requirements-server.lock -r requirements-dev.txt
      - name: Install browser runner dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local MAXBOT fixture
        shell: bash
        run: |
          set -euo pipefail
          browser_data="$RUNNER_TEMP/maxbot-browser-data"
          recovery_hold_file="$RUNNER_TEMP/maxbot-recovery-hold.json"
          mkdir -p "$browser_data"
          printf '%s\n' '{"schema_version":1,"revision":"browser-ci","reason":"browser CI recovery hold","created_at":"2026-09-21T00:00:00+00:00"}' > "$recovery_hold_file"
          MAX_DATA="$browser_data" MAX_RECOVERY_HOLD_FILE="$recovery_hold_file" \
            nohup python -m app.main --no-browser > "$RUNNER_TEMP/maxbot-browser-server.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/maxbot-browser-server.pid"
      - name: Wait for local app health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8765/api/health > "$RUNNER_TEMP/maxbot-browser-health.json"; then
              exit 0
            fi
            sleep 1
          done
          sed -n '1,240p' "$RUNNER_TEMP/maxbot-browser-server.log"
          exit 1
      - name: Run rendered browser gate
        run: npm run browser:e2e
      - name: Stop local MAXBOT fixture
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/maxbot-browser-server.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/maxbot-browser-server.pid")" 2>/dev/null || true
          fi
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maxbot-browser-diagnostics
          path: |
            playwright-report/
            test-results/
            ${{ runner.temp }}/maxbot-browser-server.log
            ${{ runner.temp }}/maxbot-browser-health.json
          if-no-files-found: ignore
          retention-days: 7
