# MAX Sender — Sprint 6 scaling stack
# Default: SQLite volume + Redis (for optional Celery) + Prometheus scrape on :8765/metrics
# Optional profile `postgres`: starts PostgreSQL (schema in schema_pg.sql; app runtime still SQLite in v1.5)

services:
  app:
    build: .
    ports:
      - "8765:8765"
    environment:
      MAX_HOST: "0.0.0.0"
      MAX_PORT: "8765"
      WORKER_POOL_SIZE: "${WORKER_POOL_SIZE:-4}"
      REDIS_URL: "redis://redis:6379/0"
      USE_CELERY: "${USE_CELERY:-0}"
    volumes:
      - max_data:/app/data
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - max_redis:/data
    restart: unless-stopped

  # Optional Celery worker (enable with USE_CELERY=1 and --profile celery)
  celery-worker:
    profiles: ["celery"]
    build: .
    command: ["celery", "-A", "celery_worker.app", "worker", "--loglevel=info", "--concurrency=4"]
    environment:
      REDIS_URL: "redis://redis:6379/0"
      USE_CELERY: "1"
    volumes:
      - max_data:/app/data
    depends_on:
      - redis
      - app
    restart: unless-stopped

  # Optional PostgreSQL for future migration (schema_pg.sql)
  postgres:
    profiles: ["postgres"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: maxsender
      POSTGRES_PASSWORD: maxsender
      POSTGRES_DB: maxsender
    ports:
      - "5432:5432"
    volumes:
      - max_pg:/var/lib/postgresql/data
      - ./schema_pg.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    restart: unless-stopped

volumes:
  max_data:
  max_redis:
  max_pg:
