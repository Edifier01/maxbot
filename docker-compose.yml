# MAX Sender — production stack (domain + HTTPS)
# Запуск из корня проекта:  docker compose up --build -d
# ponytail: sidecar digests обновлять раз в квартал (docker pull redis:7-alpine / caddy:2-alpine / postgres:16-alpine)

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8765"
    mem_limit: 1536m
    cpus: 2.0
    pids_limit: 256
    environment:
      MAX_SERVER_MODE: "1"
      MAX_HOST: "0.0.0.0"
      MAX_PORT: "8765"
      WORKER_POOL_SIZE: "${WORKER_POOL_SIZE:-4}"
      REDIS_URL: "redis://:${REDIS_PASSWORD:?задайте REDIS_PASSWORD в .env}@redis:6379/0"
      USE_CELERY: "${USE_CELERY:-0}"
      DATABASE_URL: "postgresql://maxsender:${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}@postgres:5432/maxsender"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
      JWT_SECRET: "${JWT_SECRET:?задайте JWT_SECRET в .env}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:?задайте ADMIN_EMAIL в .env}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?задайте ADMIN_PASSWORD в .env}"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:?задайте INTERNAL_SERVICE_TOKEN в .env}"
      REGISTRATION_OPEN: "${REGISTRATION_OPEN:-0}"
      AUTH_RATE_LIMIT: "${AUTH_RATE_LIMIT:-10}"
      AUTH_RATE_WINDOW_SEC: "${AUTH_RATE_WINDOW_SEC:-900}"
    volumes:
      - max_server_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,sys,urllib.request;r=urllib.request.urlopen('http://127.0.0.1:8765/api/health',timeout=4);d=json.loads(r.read());sys.exit(0 if d.get('db_ok') else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - internal

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?задайте REDIS_PASSWORD в .env}"]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?задайте REDIS_PASSWORD в .env}"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - max_server_redis:/data
    restart: unless-stopped
    networks:
      - internal

  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    ports:
      - "80:80"
      - "443:443"
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    environment:
      DOMAIN: "${DOMAIN:?задайте DOMAIN в .env}"
      LETSENCRYPT_EMAIL: "${LETSENCRYPT_EMAIL:?задайте LETSENCRYPT_EMAIL в .env}"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  celery-worker:
    profiles: ["celery"]
    build:
      context: .
      dockerfile: Dockerfile
    command: ["celery", "-A", "celery_worker.app", "worker", "--loglevel=info", "--concurrency=4"]
    mem_limit: 1024m
    cpus: 2.0
    pids_limit: 256
    environment:
      MAX_SERVER_MODE: "1"
      MAX_HOST: "app"
      MAX_PORT: "8765"
      REDIS_URL: "redis://:${REDIS_PASSWORD:?задайте REDIS_PASSWORD в .env}@redis:6379/0"
      USE_CELERY: "1"
      DATABASE_URL: "postgresql://maxsender:${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}@postgres:5432/maxsender"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:?задайте INTERNAL_SERVICE_TOKEN в .env}"
    volumes:
      - max_server_data:/app/data
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_USER: maxsender
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}"
      POSTGRES_DB: maxsender
    mem_limit: 1024m
    cpus: 1.5
    pids_limit: 256
    volumes:
      - max_server_pg:/var/lib/postgresql/data
      - ./schema_pg.sql:/docker-entrypoint-initdb.d/01_bootstrap.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maxsender -d maxsender"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:

volumes:
  max_server_data:
  max_server_redis:
  max_server_pg:
  caddy_data:
  caddy_config:
