services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: audit-fixture-password
      POSTGRES_DB: audit
    volumes:
      - audit_pg:/var/lib/postgresql/data

volumes:
  audit_pg:
